<style>
.mistake-page-layout{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;align-items:start}
.mistake-page-layout .form-panel{width:100%}
.mistake-form-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px 18px}
.mistake-form-grid .form-row{grid-column:1/-1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.mistake-form-grid label{display:grid;gap:7px;align-content:start}
.mistake-form-grid .image-preview,.mistake-form-grid .voice-status,.mistake-form-grid>button{grid-column:1/-1}
@media(max-width:720px){.mistake-form-grid .form-row{grid-template-columns:1fr}.mistake-form-grid{grid-template-columns:1fr}}
.voice-button{justify-self:start;padding:6px;width:32px;height:32px;display:grid;place-items:center}
.voice-button svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.voice-button.is-listening{background:#fff0ef;border-color:#e7aaa5;color:#b84e46}
.voice-status{font-size:10px;margin:0}
.mistake-images,.image-preview{display:flex;flex-wrap:wrap;gap:8px}
.mistake-images img,.image-preview img{width:76px;height:76px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.image-preview:empty{display:none}
</style>
