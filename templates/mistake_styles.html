<style>
.mistake-page-layout{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;align-items:start}
.mistake-page-layout .form-panel{width:100%}
.mistake-form-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px 18px}
.mistake-form-grid .form-row{grid-column:1/-1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.mistake-form-grid label{display:grid;gap:7px;align-content:start}
.mistake-form-grid .image-preview,.mistake-form-grid .voice-status,.mistake-form-grid>button{grid-column:1/-1}
@media(max-width:720px){.mistake-form-grid .form-row{grid-template-columns:1fr}.mistake-form-grid{grid-template-columns:1fr}}
.voice-button{justify-self:start;padding:6px;width:32px;height:32px;display:grid;place-items:center}
.voice-button svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.voice-button.is-listening{background:#fff0ef;border-color:#e7aaa5;color:#b84e46}
.voice-status{font-size:10px;margin:0}
.mistake-images,.image-preview{display:flex;flex-wrap:wrap;gap:8px}
.mistake-images img,.image-preview img{width:76px;height:76px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.image-preview:empty{display:none}
.image-paste-zone{grid-column:1/-1;display:grid;gap:4px;padding:14px 16px;border:1px dashed var(--line);border-radius:10px;background:#faf9ff;color:var(--ink);cursor:text}
.image-paste-zone span{font-size:11px;color:var(--muted)}
.image-paste-zone:focus{outline:2px solid #7357df;outline-offset:2px}
.image-paste-zone.is-dragging{border-color:#7357df;background:#f2efff}
.image-paste-status{grid-column:1/-1;font-size:10px;margin:0}
.upload-label{grid-column:1/-1}
.image-upload-zone{margin-top:7px;min-height:112px;padding:17px;border:1px dashed #d9d5ec;border-radius:10px;background:#faf9ff;display:flex;flex-wrap:wrap;align-items:center;gap:10px;transition:border-color .15s,background .15s}
.image-upload-zone:focus,.image-upload-zone.is-dragging{outline:none;border-color:#7357df;background:#f4f1ff}
.image-file-input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.upload-pick{white-space:nowrap}
.upload-guidance{font-size:11px;color:var(--muted)}
.image-upload-zone small{width:100%;font-size:10px}
.mistake-list{gap:14px}
.mistake-card{padding:20px 22px}
.mistake-card{position:relative;padding-top:44px}
.mistake-edit-link{position:absolute;top:15px;right:18px;display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border:1px solid var(--line);border-radius:7px;color:var(--purple);font-size:11px;font-weight:600;text-decoration:none;background:#fff}
.mistake-edit-link:hover,.mistake-edit-link:focus{background:#f6f4ff;border-color:#ddd6fb;color:#6246ce}
.mistake-card h3{font-size:16px;line-height:1.5;margin:14px 0 12px}
.mistake-card p{line-height:1.65;margin:8px 0}
.mistake-card p strong{color:var(--ink)}
.mistake-top{gap:12px;flex-wrap:wrap}
.mistake-top .muted{font-size:10px}
.mistake-images{margin:14px 0}
.mistake-actions{display:flex;align-items:center;gap:9px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.mistake-actions form{margin:0}
.mistake-actions .btn{font-size:11px}
.edit-existing-images,.edit-mistake-actions{grid-column:1/-1}
.edit-existing-images{display:grid;gap:9px}
.edit-mistake-actions{display:flex;justify-content:flex-end;gap:9px;padding-top:14px;border-top:1px solid var(--line)}
@media(max-width:560px){.mistake-card{padding:16px}.image-upload-zone{align-items:flex-start;flex-direction:column}}
</style>
