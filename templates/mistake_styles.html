<style>
.mistake-page-layout{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;align-items:start}
.mistake-page-layout .form-panel{width:100%}
.mistake-form-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px 18px}
.mistake-form-grid .form-row{grid-column:1/-1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.mistake-form-grid label{display:grid;gap:7px;align-content:start}
.mistake-form-grid .image-preview,.mistake-form-grid .voice-status,.mistake-form-grid>button{grid-column:1/-1}
@media(max-width:720px){.mistake-form-grid .form-row{grid-template-columns:1fr}.mistake-form-grid{grid-template-columns:1fr}}
.voice-button{justify-self:start;padding:6px;width:32px;height:32px;display:grid;place-items:center}
.voice-button svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.voice-button.is-listening{background:#fff0ef;border-color:#e7aaa5;color:#b84e46}
.voice-status{font-size:10px;margin:0}
.mistake-images,.image-preview{display:flex;flex-wrap:wrap;gap:8px}
.mistake-images img,.image-preview img{width:76px;height:76px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.image-preview:empty{display:none}
.image-paste-zone{grid-column:1/-1;display:grid;gap:4px;padding:14px 16px;border:1px dashed var(--line);border-radius:10px;background:#faf9ff;color:var(--ink);cursor:text}
.image-paste-zone span{font-size:11px;color:var(--muted)}
.image-paste-zone:focus{outline:2px solid #7357df;outline-offset:2px}
.image-paste-zone.is-dragging{border-color:#7357df;background:#f2efff}
.image-paste-status{grid-column:1/-1;font-size:10px;margin:0}
.upload-label{grid-column:1/-1}
.image-upload-zone{margin-top:7px;min-height:112px;padding:17px;border:1px dashed #d9d5ec;border-radius:10px;background:#faf9ff;display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto auto auto;align-items:center;gap:8px 16px;transition:border-color .15s,background .15s}
.image-upload-zone:focus,.image-upload-zone.is-dragging{outline:none;border-color:#7357df;background:#f4f1ff}
.image-file-input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.upload-pick{white-space:nowrap}
.upload-guidance{font-size:11px;color:var(--muted)}
.upload-tools{display:flex;align-items:center;gap:10px;grid-column:1;grid-row:1}
.image-upload-zone small,.image-paste-status{width:100%;font-size:10px;margin:0}
.image-upload-zone>.muted,.image-upload-zone>.file-size-error{grid-column:1;grid-row:2}
.image-upload-zone>.image-paste-status{grid-column:1;grid-row:3}
.image-upload-zone .image-preview{grid-column:2;grid-row:1 / span 3;justify-content:flex-end;align-content:center;width:min(100%,290px);max-width:290px;padding:2px 8px 2px 0}
.image-upload-zone:not(.has-preview) .upload-tools{grid-column:1/-1;justify-content:center}
.image-upload-zone:not(.has-preview)>.muted,.image-upload-zone:not(.has-preview)>.image-paste-status{grid-column:1/-1;text-align:center}
.image-upload-zone:not(.has-preview)>.file-size-error{grid-column:1/-1;text-align:center}
.image-preview-item{position:relative;width:82px;height:82px;flex:0 0 82px}
.image-preview-open{display:block;width:100%;height:100%;padding:0;border:0;border-radius:9px;background:transparent;cursor:zoom-in}
.image-preview-item img{display:block;width:100%;height:100%;object-fit:cover;border:1px solid var(--line);border-radius:9px;background:white}
.image-preview-remove{position:absolute;top:-7px;right:-7px;width:22px;height:22px;padding:0;border:1px solid #fff;border-radius:50%;background:#31313d;color:white;font-size:18px;line-height:18px;display:grid;place-items:center;box-shadow:0 1px 5px #0003;cursor:pointer}
.image-preview-remove:hover,.image-preview-remove:focus{background:#c83d49;outline:2px solid #fff}
.image-lightbox{position:fixed;max-width:min(92vw,1100px);max-height:92vh;padding:42px 16px 16px;border:0;border-radius:12px;background:#17171c;overflow:visible}
.image-lightbox::backdrop{background:#111827cc;backdrop-filter:blur(3px)}
.image-lightbox img{display:block;max-width:calc(92vw - 32px);max-height:calc(92vh - 72px);object-fit:contain;border-radius:5px}
.image-lightbox-close{position:absolute;top:8px;right:8px;width:30px;height:30px;border:0;border-radius:50%;background:#ffffff22;color:white;font-size:23px;line-height:1;cursor:pointer}
.image-lightbox-close:hover,.image-lightbox-close:focus{background:#ffffff44;outline:2px solid #fff}
.mistake-list{gap:14px}
.mistake-card{display:grid;grid-template-columns:minmax(0,1fr) minmax(130px,220px);gap:12px 20px;align-items:start;padding:16px 20px}
.mistake-card:not(.has-images) .mistake-copy{grid-column:1/-1}
.mistake-card-actions{grid-column:1/-1;display:flex;justify-content:flex-end;align-items:center;gap:7px;margin-bottom:0}
.mistake-card-actions form{margin:0}
.mistake-edit-link{display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border:1px solid var(--line);border-radius:7px;color:var(--purple);font-size:11px;font-weight:600;text-decoration:none;background:#fff}
.mistake-edit-link:hover,.mistake-edit-link:focus{background:#f6f4ff;border-color:#ddd6fb;color:#6246ce}
.mistake-card-actions .btn{font-size:10px;padding:7px 10px}
.mistake-card h3{font-size:15px;line-height:1.45;margin:10px 0}
.mistake-card p{line-height:1.65;margin:8px 0}
.mistake-card p strong{color:var(--ink)}
.mistake-top{gap:12px;flex-wrap:wrap}
.mistake-top .muted{font-size:10px}
.mistake-images{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;max-height:220px;overflow:auto;padding:2px 3px 2px 0;margin:0}
.mistake-images a{display:block;min-width:0}
.mistake-images img{display:block;width:100%;height:98px;object-fit:contain;background:#f8f8fb}
.edit-existing-images,.edit-mistake-actions{grid-column:1/-1}
.edit-existing-images{display:grid;gap:9px}
.edit-mistake-actions{display:flex;justify-content:flex-end;gap:9px;padding-top:14px;border-top:1px solid var(--line)}
@media(max-width:650px){.mistake-card,.mistake-card.has-images{grid-template-columns:minmax(0,1fr)}.mistake-card.has-images .mistake-copy{grid-column:1}.mistake-images{grid-template-columns:repeat(auto-fill,minmax(72px,1fr));max-height:none}.mistake-images img{height:100px}}
@media(max-width:560px){.mistake-card{padding:14px}.image-upload-zone{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto auto}.upload-tools{align-items:flex-start;flex-direction:column;grid-row:1}.image-upload-zone>.muted,.image-upload-zone>.file-size-error{grid-column:1;grid-row:2}.image-upload-zone>.image-paste-status{grid-column:1;grid-row:3}.image-upload-zone .image-preview{grid-column:1;grid-row:4;justify-content:flex-start;max-width:100%;padding:3px 8px 3px 0}}
</style>
